name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-tested.txt
      - name: Install tested analysis dependencies
        run: python -m pip install -r requirements-tested.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - name: Audit analysis data
        run: python src/audit_data.py
      - name: Audit documented results
        run: python src/paper_claim_audit.py
